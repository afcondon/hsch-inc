<!doctype html><meta charset="utf-8">
<title>export — wide composition</title>
<!-- Dev-only harness: renders composition-study.html's 6720x3240 stage alone,
     with no page chrome, so it can be captured headless as one image.
     ?s=0.5 halves it. Not part of the study; delete freely. -->
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#f2ede2}
  #clip{position:relative;overflow:hidden}
  iframe{position:absolute;border:0;width:7200px;height:9000px;
         transform-origin:0 0;background:#f2ede2}
</style>
<div id="clip"><iframe id="f" src="composition-study.html?z=1"></iframe></div>
<script>
const Q = new URLSearchParams(location.search);
const S = +(Q.get('s') || 1);
// ?fx=&fy= frames a 1920x1080 camera window instead of the whole surface,
// which is what the viewer actually sees at any moment.
const FX = Q.get('fx') !== null ? +Q.get('fx') : null;
const FY = Q.get('fy') !== null ? +Q.get('fy') : 0;
const W = FX === null ? 6720 : 1920;
const H = FX === null ? 3240 : 1080;
const clip = document.getElementById('clip'), f = document.getElementById('f');
clip.style.width  = (W*S)+'px';
clip.style.height = (H*S)+'px';
document.documentElement.style.width  = (W*S)+'px';
document.documentElement.style.height = (H*S)+'px';
f.addEventListener('load', () => {
  const d = f.contentDocument;
  const st = d.getElementById('stWide');
  const vp = d.getElementById('vpWide');
  // The study keeps the stage inside a scroller, so at 100% only the visible
  // width renders. Force the whole surface open before measuring.
  if (vp) {
    vp.scrollLeft = 0; vp.scrollTop = 0;
    vp.style.overflow = 'visible';
    vp.style.width = 6720 + 'px';
    vp.style.maxWidth = 'none';
    vp.style.height = 3240 + 'px';
  }
  for (let n = st.parentElement; n && n !== d.body; n = n.parentElement) {
    n.style.maxWidth = 'none'; n.style.overflow = 'visible';
    if (getComputedStyle(n).width !== 'auto') n.style.width = 6720 + 'px';
  }
  d.body.style.width = 7120 + 'px';
  d.body.style.maxWidth = 'none';
  const r = st.getBoundingClientRect();
  // place the stage's top-left at the clip's origin, then scale
  const ox = FX === null ? 0 : FX, oy = FX === null ? 0 : FY;
  f.style.transform = `scale(${S}) translate(${-r.left - ox}px, ${-r.top - oy}px)`;
  document.title = 'READY';
});
</script>
